<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anjos de Sangue ADS - Cadastro</title>
    <!-- Carrega Tailwind CSS para estilização e responsividade -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuração de cores e fonte personalizada para o projeto */
        :root {
            --cor-sangue: #A50000; /* Vermelho forte */
            --cor-clara: #F8F8F8;
            --cor-contraste: #2C2C2C;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cor-clara);
            color: var(--cor-contraste);
        }
        .bg-sangue { background-color: var(--cor-sangue); }
        .text-sangue { color: var(--cor-sangue); }
        .border-sangue { border-color: var(--cor-sangue); }
        /* Estilo para inputs (Melhora a visualização da validação nativa) */
        input:invalid:not(:focus), input:invalid:not(:placeholder-shown) {
            border-color: #EF4444; /* Vermelho claro para inputs inválidos */
            box-shadow: 0 0 0 1px #EF4444;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Cabeçalho e Navegação (Header) -->
    <header class="bg-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex items-center justify-between h-16" aria-label="Navegação Principal">
                <!-- Logo Semântica (H1) -->
                <h1 class="flex items-center text-xl font-bold text-sangue">
                    <!-- Ícone de Gotinha de Sangue com Cruz Branca (Simulação da Logo) -->
                    <svg width="28" height="28" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 mr-2">
                    <!-- Fundo da Gota (Vermelho Escuro) -->
                <path 
                d="M 50,10 C 80,10 90,40 80,60 C 70,80 50,95 50,95 C 50,95 30,80 20,60 C 10,40 20,10 50,10 Z"
                fill="#A50000"
                />
                    <!-- Cruz Branca no Meio -->
                <g transform="translate(50, 55) scale(0.6)">
                <line x1="-30" y1="0" x2="30" y2="0" stroke="white" stroke-width="10" stroke-linecap="round" fill="none" />
                <line x1="0" y1="-30" x2="0" y2="30" stroke="white" stroke-width="10" stroke-linecap="round" fill="none" />
                </g>
                </svg>
                    Anjos de Sangue ADS
                </h1>

                <!-- Links de Navegação -->
                <ul class="flex space-x-4">
                    <li><a href="index.html" class="text-gray-600 hover:text-sangue pb-1">Início</a></li>
                    <li><a href="projetos.html" class="text-gray-600 hover:text-sangue pb-1">Projetos</a></li>
                    <li><a href="cadastro.html" class="text-sangue font-semibold border-b-2 border-sangue pb-1" aria-current="page">Cadastro</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo Principal (Main) -->
    <main class="flex-grow py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-4xl mx-auto bg-white p-8 sm:p-12 rounded-xl shadow-2xl border-t-8 border-sangue">
            
            <!-- Hierarquia de Títulos: H2 como título principal da página -->
            <h2 class="text-3xl font-bold text-center mb-2 text-contraste sm:text-4xl">
                Torne-se um Anjo de Sangue!
            </h2>
            <p class="text-center text-gray-600 mb-8">
                Preencha o formulário abaixo para fazer parte da nossa rede de doadores.
            </p>
            
            <!-- Formulário Semântico e Interativo -->
            <form id="cadastro-form" action="#" method="POST" class="space-y-8">
                
                <!-- Agrupamento Lógico 1: Informações Pessoais -->
                <fieldset class="border border-gray-300 p-6 rounded-lg shadow-sm">
                    <legend class="text-xl font-semibold text-sangue px-2">Dados Pessoais</legend>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                        <!-- Nome Completo (Text Input) -->
                        <div>
                            <label for="nome" class="block text-sm font-medium text-gray-700">Nome Completo</label>
                            <input type="text" id="nome" name="nome" placeholder="Seu nome completo"
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                                required pattern="[A-Za-zÀ-ÿ\s]{5,}" title="Preencha o nome completo."
                            >
                        </div>
                        
                        <!-- E-mail (Email Input com Validação Nativa) -->
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="email@exemplo.com"
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                                required title="Preencha um e-mail válido."
                            >
                        </div>

                        <!-- CPF (Input com Máscara e Pattern) -->
                        <div>
                            <label for="cpf" class="block text-sm font-medium text-gray-700">CPF (Máscara: 000.000.000-00)</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                                required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00"
                                inputmode="numeric"
                            >
                        </div>
                        
                        <!-- Telefone (Input com Máscara e Pattern) -->
                        <div>
                            <label for="telefone" class="block text-sm font-medium text-gray-700">Telefone (Máscara: (00) 0 0000-0000)</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="(00) 0 0000-0000"
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                                required pattern="\(\d{2}\) \d{5}-\d{4}" title="Formato: (XX) 9XXXX-XXXX"
                                inputmode="tel"
                            >
                        </div>

                        <!-- Data de Nascimento (Date Input) -->
                        <div>
                            <label for="nascimento" class="block text-sm font-medium text-gray-700">Data de Nascimento</label>
                            <input type="date" id="nascimento" name="nascimento"
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                                required
                            >
                        </div>
                        
                        <!-- Tipo Sanguíneo (Select, não obrigatório no enunciado, mas crucial para a ONG) -->
                        <div>
                            <label for="tiposanguineo" class="block text-sm font-medium text-gray-700">Tipo Sanguíneo</label>
                            <select id="tiposanguineo" name="tiposanguineo" 
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                            >
                                <option value="" disabled selected>Selecione seu tipo</option>
                                <option value="O+">O+</option><option value="O-">O-</option>
                                <option value="A+">A+</option><option value="A-">A-</option>
                                <option value="B+">B+</option><option value="B-">B-</option>
                                <option value="AB+">AB+</option><option value="AB-">AB-</option>
                            </select>
                        </div>
                    </div>
                </fieldset>
                
                <!-- Agrupamento Lógico 2: Endereço -->
                <fieldset class="border border-gray-300 p-6 rounded-lg shadow-sm">
                    <legend class="text-xl font-semibold text-sangue px-2">Endereço Completo</legend>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                        
                        <!-- CEP (Input com Máscara e Pattern) -->
                        <div>
                            <label for="cep" class="block text-sm font-medium text-gray-700">CEP (Máscara: 00000-000)</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000"
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                                required pattern="\d{5}-\d{3}" title="Formato: 00000-000"
                                inputmode="numeric"
                            >
                        </div>
                        
                        <!-- Endereço (Text Input) -->
                        <div>
                            <label for="endereco" class="block text-sm font-medium text-gray-700">Endereço (Rua, Av.)</label>
                            <input type="text" id="endereco" name="endereco" placeholder="Rua / Avenida e número"
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                                required
                            >
                        </div>
                        
                        <!-- Cidade (Text Input) -->
                        <div>
                            <label for="cidade" class="block text-sm font-medium text-gray-700">Cidade</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Sua cidade"
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                                required
                            >
                        </div>
                        
                        <!-- Estado (Select) -->
                        <div>
                            <label for="estado" class="block text-sm font-medium text-gray-700">Estado</label>
                            <select id="estado" name="estado" required
                                class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-sangue focus:border-sangue"
                            >
                                <option value="" disabled selected>Selecione um Estado</option>
                                <option value="SP">São Paulo</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PR">Paraná</option>
                                <option value="BA">Bahia</option>
                                <!-- Adicionar mais estados conforme a necessidade -->
                            </select>
                        </div>
                        
                    </div>
                </fieldset>
                
                <!-- Botão de Cadastro -->
                <div class="pt-5">
                    <button type="submit" class="w-full bg-sangue text-white font-bold py-4 rounded-xl shadow-lg hover:bg-red-700 transition duration-300 transform hover:scale-[1.01]">
                        CADASTRAR E ME TORNAR UM ANJO!
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Imagem de doação para ilustrar a página -->
        <img src="https://placehold.co/800x250/A50000/FFFFFF?text=" alt="Ícone de um coração abraçando uma gota de sangue, simbolizando a doação" class="mx-auto mt-8 rounded-lg w-full max-w-4xl h-auto object-cover">

    </main>

    <!-- Rodapé (Footer) -->
    <footer class="bg-contraste text-white mt-12 py-6 text-center" role="contentinfo">
        <div class="max-w-7xl mx-auto px-4">
            <p class="text-sm">&copy; 2025 Anjos de Sangue ADS. Sua jornada de solidariedade começa aqui.</p>
        </div>
    </footer>
    
    <!-- Script JS para Máscaras de Input -->
    <script>
        // Função universal para aplicar a máscara no input
        function applyMask(input, mask) {
            input.addEventListener('input', function() {
                let value = input.value.replace(/\D/g, ''); // Remove não-dígitos
                let maskedValue = '';
                let patternIndex = 0;

                for (let i = 0; i < mask.length; i++) {
                    if (patternIndex >= value.length) break;

                    if (mask[i] === '0') {
                        maskedValue += value[patternIndex];
                        patternIndex++;
                    } else {
                        maskedValue += mask[i];
                    }
                }
                input.value = maskedValue;
            });
        }

        window.onload = function() {
            const cpfInput = document.getElementById('cpf');
            const telefoneInput = document.getElementById('telefone');
            const cepInput = document.getElementById('cep');

            // Define as máscaras e aplica as funções
            const maskCPF = '000.000.000-00';
            const maskTelefone = '(00) 0 0000-0000'; // Suporta o 9º dígito
            const maskCEP = '00000-000';

            applyMask(cpfInput, maskCPF);
            applyMask(telefoneInput, maskTelefone);
            applyMask(cepInput, maskCEP);
            
            // Define o maxlength para melhor usabilidade
            cpfInput.maxLength = maskCPF.length;
            telefoneInput.maxLength = maskTelefone.length; 
            cepInput.maxLength = maskCEP.length;
            
            // Previne o envio se a validação nativa falhar (apenas para UX, a validação é nativa)
            document.getElementById('cadastro-form').addEventListener('submit', function(e) {
                if (!this.checkValidity()) {
                    e.preventDefault();
                    // Alerta visual de falha de validação nativa do navegador
                } else {
                    // Simulação de envio
                    e.preventDefault(); 
                    alert('Cadastro enviado com sucesso! (Simulação)');
                }
            });
        }
    </script>
</body>
</html>
